<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script type="module" src="add_user.js"></script>
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
   <!-- Navbar (Always Collapsed) -->
   <nav class="navbar navbar-dark" style="background-color: #8C1B08;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">PHASEMASH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav ms-auto text-end">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="leaderboard.html">Leaderboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="index.html">Vote</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Centered Content -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-6">
                <div class="card shadow-lg p-4 mx-auto" style="max-width: 400px;">
                    <div class="card-header text-center text-white" style="background-color: #8C1B08;">
                        <h4 class="fw-bold">Add User</h4>
                    </div>
                    <div class="card-body">
                        <form id="userForm">
                            <div class="mb-3">
                                <label for="userName" class="form-label fw-semibold">Name</label>
                                <input type="text" class="form-control" id="userName" name="name"
                                    placeholder="Enter your name" required>
                            </div>
                            <div class="mb-3">
                                <label for="userImage" class="form-label fw-semibold">Upload Image</label>
                                <input type="file" class="form-control" id="userImage" name="image" accept="image/*">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User List Section -->
    <div class="container mt-4">
        <div id="usersList" class="row justify-content-center"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
